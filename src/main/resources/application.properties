spring.application.name=urutau-jigs
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.servlet.session.timeout=45m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/urutau;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.accept-float-as-int=false
spring.flyway.enabled=true
urutau.admin.primary.username=${ADMIN_1_USERNAME:}
urutau.admin.primary.password=${ADMIN_1_PASSWORD:}
urutau.admin.secondary.username=${ADMIN_2_USERNAME:}
urutau.admin.secondary.password=${ADMIN_2_PASSWORD:}
urutau.ai.provider=${AI_PROVIDER:gemini}
urutau.ai.gemini.api-key=${GEMINI_API_KEY:}
urutau.ai.gemini.model=${GEMINI_MODEL:}
urutau.ai.openai.api-key=${OPENAI_API_KEY:}
urutau.ai.openai.model=${OPENAI_MODEL:}
