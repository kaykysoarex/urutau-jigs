<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19191c">
  <meta name="apple-mobile-web-app-title" content="URUTAU JIGS">
  <title>Sem conexão | URUTAU JIGS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/app.css">
  <script src="/pwa.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="pwa-offline-heading">
    <div class="login-brand"><span class="brand-logo"><img src="/assets/urutau-logo.png" width="615" height="615" alt="URUTAU JIGS"></span></div>
    <div class="login-content pwa-connection">
      <div class="login-title">
        <h1 id="pwa-offline-heading">Você está sem conexão.</h1>
        <p>Conecte-se à internet para continuar utilizando o URUTAU JIGS.</p>
      </div>
      <button id="pwa-retry" class="button primary" type="button">Tentar novamente</button>
      <p id="pwa-retry-status" class="pwa-connection-status" role="status"></p>
      <noscript><a href="/">Tentar novamente</a></noscript>
    </div>
  </main>
</body>
</html>
